<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- Optional warm background (3px padding around the 22x22 tile grid) -->
  <rect width="28" height="28" rx="4" fill="#F6F3EC" />
  <!-- Top-Left: 10x10 tile, rx=1 -->
  <rect x="3" y="3" width="10" height="10" rx="1" fill="#1E1E1C" />
  <!-- Top-Right: 10x10 tile, 2px gap (x=15), rx=1, rotated 6 deg around its center (20, 8) -->
  <rect x="15" y="3" width="10" height="10" rx="1" fill="#B85D3B" transform="rotate(6 20 8)" />
  <!-- Bottom-Left: 10x10 tile, 2px gap (y=15), rx=1 -->
  <rect x="3" y="15" width="10" height="10" rx="1" fill="#5A5852" />
  <!-- Bottom-Right: 10x10 tile, 2px gap (x=15, y=15), rx=1 -->
  <rect x="15" y="15" width="10" height="10" rx="1" fill="#1E1E1C" />
</svg>
